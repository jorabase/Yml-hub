name: 🚀 Google Drive Downloader

on:
  workflow_dispatch:
    inputs:
      drive_urls:
        description: "Google Drive URL(s), one per line"
        required: true
        type: string

      output_name:
        description: "ZIP file name"
        required: false
        default: "Google-Drive-Files"
        type: string

      create_zip:
        description: "Create ZIP archive"
        required: false
        default: true
        type: boolean

      retention_days:
        description: "Artifact retention days"
        required: false
        default: "7"
        type: string

jobs:
  download:
    name: 📥 Download Google Drive Files
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: 📦 Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            zip \
            unzip \
            p7zip-full \
            file \
            curl \
            wget

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade gdown

          echo "Installed gdown version:"
          gdown --version

      - name: 📁 Prepare Workspace
        run: |
          rm -rf downloads output
          mkdir -p downloads
          mkdir -p output

      - name: 📥 Download Files
        env:
          DRIVE_URLS: ${{ inputs.drive_urls }}
        run: |
          set -Eeuo pipefail

          echo "$DRIVE_URLS" | tr ',' '\n' | while IFS= read -r URL
          do
            URL="$(echo "$URL" | xargs)"

            if [ -z "$URL" ]; then
              continue
            fi

            echo ""
            echo "=========================================="
            echo "Downloading:"
            echo "$URL"
            echo "=========================================="

            # Extract Google Drive File ID
            FILE_ID=""

            if [[ "$URL" == *"/file/d/"* ]]; then
              FILE_ID="$(echo "$URL" | sed -nE 's#.*\/file\/d\/([^\/?]+).*#\1#p')"

            elif [[ "$URL" == *"id="* ]]; then
              FILE_ID="$(echo "$URL" | sed -nE 's#.*[?&]id=([^&]+).*#\1#p')"

            elif [[ "$URL" == *"uc?id="* ]]; then
              FILE_ID="$(echo "$URL" | sed -nE 's#.*uc\?id=([^&]+).*#\1#p')"

            else
              # Assume the input itself is a File ID
              FILE_ID="$URL"
            fi

            if [ -z "$FILE_ID" ]; then
              echo "❌ Could not extract File ID"
              exit 1
            fi

            echo "File ID: $FILE_ID"

            DOWNLOAD_URL="https://drive.google.com/uc?id=${FILE_ID}"

            echo "Download URL:"
            echo "$DOWNLOAD_URL"

            # IMPORTANT:
            # No --fuzzy here.
            gdown "$DOWNLOAD_URL" \
              --output "downloads/${FILE_ID}"

            if [ ! -s "downloads/${FILE_ID}" ]; then
              echo "❌ Download failed or file is empty"
              exit 1
            fi

            echo "✅ Download successful"
            ls -lh "downloads/${FILE_ID}"

          done

      - name: 🔍 Verify Downloaded Files
        run: |
          echo "=========================================="
          echo "Downloaded Files"
          echo "=========================================="

          if [ -z "$(find downloads -type f -print -quit)" ]; then
            echo "❌ No files downloaded"
            exit 1
          fi

          find downloads -type f -exec ls -lh {} \;

          echo ""
          echo "File types:"
          find downloads -type f -exec file {} \;

      - name: 🏷️ Detect File Extensions
        run: |
          for FILE in downloads/*; do

            [ -f "$FILE" ] || continue

            TYPE="$(file -b "$FILE")"
            BASE="${FILE%.*}"

            if echo "$TYPE" | grep -qi "PDF"; then
              mv "$FILE" "${BASE}.pdf"

            elif echo "$TYPE" | grep -qi "Zip archive"; then
              mv "$FILE" "${BASE}.zip"

            elif echo "$TYPE" | grep -qi "PNG"; then
              mv "$FILE" "${BASE}.png"

            elif echo "$TYPE" | grep -qi "JPEG"; then
              mv "$FILE" "${BASE}.jpg"

            elif echo "$TYPE" | grep -qi "Web/P"; then
              mv "$FILE" "${BASE}.webp"

            elif echo "$TYPE" | grep -qi "Microsoft Word"; then
              mv "$FILE" "${BASE}.docx"

            elif echo "$TYPE" | grep -qi "Microsoft Excel"; then
              mv "$FILE" "${BASE}.xlsx"

            elif echo "$TYPE" | grep -qi "Microsoft PowerPoint"; then
              mv "$FILE" "${BASE}.pptx"
            fi

          done

          echo "Final files:"
          find downloads -type f -exec ls -lh {} \;

      - name: 🔐 Generate SHA256
        run: |
          find downloads -type f -print0 | \
            xargs -0 sha256sum > output/SHA256SUMS.txt

          cat output/SHA256SUMS.txt

      - name: 📝 Generate Report
        run: |
          {
            echo "# Google Drive Download Report"
            echo
            echo "## Files"
            echo

            find downloads -type f -printf '%f\n' |
              while read FILE; do
                echo "- $FILE"
              done

            echo
            echo "## SHA256"
            echo
            cat output/SHA256SUMS.txt

          } > output/REPORT.md

          cat output/REPORT.md

      - name: 🗜️ Create ZIP
        if: ${{ inputs.create_zip }}
        env:
          ZIP_NAME: ${{ inputs.output_name }}
        run: |
          cd downloads

          zip -r "../output/${ZIP_NAME}.zip" .

          cd ..

          echo "ZIP created:"
          ls -lh "output/${ZIP_NAME}.zip"

      - name: 📤 Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-files
          path: downloads/
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

      - name: 📤 Upload ZIP
        if: ${{ inputs.create_zip }}
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-zip
          path: output/*.zip
          retention-days: ${{ inputs.retention_days }}
          compression-level: 0

      - name: 📊 Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: download-report
          path: |
            output/REPORT.md
            output/SHA256SUMS.txt
          retention-days: ${{ inputs.retention_days }}

      - name: 🎉 Complete
        run: |
          echo ""
          echo "=========================================="
          echo "        ✅ DOWNLOAD COMPLETE"
          echo "=========================================="
          echo ""
          echo "📁 Individual files:"
          echo "   google-drive-files"
          echo ""
          echo "🗜️ ZIP:"
          echo "   google-drive-zip"
          echo ""
          echo "📊 Report:"
          echo "   download-report"
          echo ""
          echo "Go to the GitHub Actions run"
          echo "and download the Artifact."
          echo "=========================================="
